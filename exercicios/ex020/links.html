<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /* 
        SELETORES PERSONALIZADOS

        # = id
        . = class
        : = pseudoclass
        :: = paseudoelement
        > = children
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgb(255, 188, 65);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: chartreuse;
        }

        a:hover {
            text-decoration: underline;
            color: black;
        }

        a:active {
            color: blueviolet;
        }

        a::before {
            content: ">>>";
            color: beige;
        }

        a::after {
            content: "<<<";
            color: beige;
        }
    </style>
</head>
<body>
    <h1>Personalisando Links</h1>
    <ul>
        <li><a href="https://gemini.google.com/" target="_blank">Gemini</a></li>
        <li><a href="https://chatgpt.com/" target="_blank">Chat GPT</a></li>
        <li><a href="https://grok.com/" target="_blank">Grok</a></li>
        <li><a href="https://claude.ai/" target="_blank">Claude</a></li>
    </ul>
</body>
</html>
