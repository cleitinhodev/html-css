<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externa</title>
    <style>
        @font-face {
            font-family: 'Round 6';
            src: url('fontes/Game Of Squids.otf') format('opentype'), url('fontes/Game Of Squids.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;

            /* Tipos de format() 
            - opentype (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advanced Typography)
            - svg*/
        }
        body {
            font-family: 'Times New Roman', Times, serif;
        }
        h1 {
            font-family: 'Round 6';
        }

        p {
            font-family: 'Round 6';
        }
    </style>
</head>
<body>
    <h1>Título do Texto</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Minima eligendi repellat aliquam, provident laborum aspernatur fugiat incidunt voluptatibus nihil sapiente non, magni, temporibus maiores quasi maxime ullam in! Cupiditate, ab.</p>
    <h1>Game Of Squids</h1>
</body>
</html>
